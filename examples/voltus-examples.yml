description: >-
  Real request/response examples. Every response below was captured live on
  2026-07-27 by calling the Voltus public sandbox anonymously with the
  credentials Voltus publishes at
  https://api.voltus.co/docs/concepts/public-credentials
  (host https://sandbox.voltus.co, header "X-Voltus-API-Key: secret").
  Nothing here is synthesised - the sandbox serves fixed fixtures and these are
  those fixtures verbatim. The webhook payload shape is taken verbatim from
  Voltus's own example webhook server.
