  - file: voltus-dispatch-webhook-payload.json
    operationId: null
    request: POST <your listener URL> (Voltus -> partner callback)
    status: null
    captured: '2026-07-27'
    source: https://github.com/voltusdev/voltus-api-examples/blob/main/webhooks/webhook-server.py
    note: >-
      Inbound webhook body shape, read from Voltus's first-party example
      listener: {"event": {"name": ...}, "resource": <dispatch resource path>}.
