findings:
  summary: >-
    Voltus is the flexibility-layer counter-example in the energy sector. It has
    no consumer-data mandate of any kind and therefore nothing to comply with,
    yet it ships a better developer experience than almost any mandated utility:
    a public portal, tutorials, a changelog with RSS, and a live anonymous
    sandbox that answers real requests with published credentials. The catch is
    that the openness stops at the fixture data. Production is partner-only,
    proven by a 401 from the very key the vendor publishes, and the data behind
    it — site telemetry, dispatch commitments — reaches partners through a signed
    Letter of Authorization and a commercial agreement, not through a data right.
    The one open standard in the stack is OpenADR 2.0a over mutual TLS; there is
    no Green Button, no ESPI, no CIM, no IEEE 2030.5. And despite consuming nine
    North American wholesale markets, Voltus republishes none of that data
    openly. A mandate would have produced a standardised, accredited, consented
    surface and probably worse docs; the absence of a mandate produced excellent
    docs and a proprietary, contractual surface.
