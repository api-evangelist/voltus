      description: 'Returns a list of telemetry readings for one or more sites. The maximum number of
        sites per request is 10. The maximum request interval is 90 days, with a limit of 10,000 total
        data points per site.


        This endpoint returns data that was available at the time of request, if the site''s telemetry
        is delayed recent data may be incomplete. This is particularly important when fetching data for
        a larger interval. If fetching data for an hour (3600 seconds), we recommend waiting at least
        20 minutes in most cases after the end of that interval to be sure data has been fully submitted.
        When in doubt, you can also fetch data for a smaller interval length which will give a better
        picture of what data is actually available.'
