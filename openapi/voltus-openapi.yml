        points in the same request. You can also post non-contiguous intervals, intervals for multiple
        meters, and intervals that have been submitted before, all without issue. We''ll handle the de-duplication
        of double-submitted points, and you can take this into consideration when implementing retry and
        failure logic.


        There is a limit on the number of telemetry points per request. We recommend keeping requests
        to 2048 points or fewer. Requests that exceed the maximum will receive a `413 Content Too Large`
        response — split the data into smaller batches and retry.'
