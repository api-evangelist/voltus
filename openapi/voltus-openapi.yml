  /2022-04-15/sites:
    get:
      tags:
      - Sites
      description: 'Returns a list of your sites.


        The sites endpoint is important because a given API key will only get dispatch notifications that
        include sites visible to the account. You should make sure that all expected sites are returned
        by this endpoint.


        Sites include `id` and `customer_location_id` fields that can be used to identify sites in a dispatch
        communication. A site''s `name` value may change, and should not be used as a static identifier.


        All sites will be returned in a single request. The values of `page` and `per_page` have been
        reserved for future use, but should be ignored at present.'
