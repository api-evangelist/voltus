      security:
      - X-Voltus-API-Key: []
  /2022-04-15/dispatches/{id}:
    get:
      tags:
      - Dispatches
      description: 'Retrieves the dispatch with the given ID.


        Can be used to explicitly check for the status of an individual dispatch.'
      operationId: voltus#get-dispatch
      parameters:
      - name: id
        in: path
        description: The dispatch ID
        required: true
        schema:
          type: string
          description: The dispatch ID
          example: 12345678asdfghjk
        example: 12345678asdfghjk
      - name: X-Voltus-API-Key
        in: header
        description: API key used to perform authorization
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: API key used to perform authorization
          example: API_KEY
        example: API_KEY
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorized:
                    type: boolean
                    description: The authorization status of the dispatch. If this value is false, a dispatch is cancelled, and curtailment can stop immediately.
                    example: true
                  creation_time:
                    type: string
                    description: Time the dispatch was created. Formatted as a RFC 3339 timestamp.
                    example: '2024-02-02T08:00:00Z'
                  end_time:
                    type: string
                    description: End time of the dispatch. This attribute will be omitted until an end time is determined. All dispatches will eventually have an end time unless they are cancelled. Formatted as a RFC 3339 timestamp.
                    example: '2024-02-02T10:00:00Z'
                  id:
                    type: string
                    description: Primary key of the dispatch.
                    example: 5j94
                  metadata:
                    type: object
                    description: Extra metadata on the dispatch, if available. May be omitted. You can ignore this field unless instructed otherwise by Voltus.
                    example:
                      dispatch_source: manual_test
                    additionalProperties: true
                  modification_number:
                    type: integer
                    description: Number of times this dispatch has been modified since creation.
                    example: 0
                    format: int64
                  program:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Unique integer identifier for program. Will not change.
                        example: 867
                        format: int64
                      market:
                        type: string
                        description: The market the program is participating in
                        example: CAISO
                      name:
                        type: string
                        description: The program's name
                        example: CAISO Operating Reserves
                      program_type:
                        type: string
                        description: the type of program
                        example: ancillary_services
                        enum:
                        - ancillary_services
                        - capacity
                        - energy
                        - peak_saver
                        - utility_interruptible_rate
                        - utility_program
                        - not_specified
                      timezone:
                        type: string
                        description: The program's time zone (ignore to determine dispatch start and end times)
                        example: US/Pacific
                    example:
                      id: 867
                      market: CAISO
                      name: CAISO Operating Reserves
                      program_type: ancillary_services
                      timezone: US/Pacific
                    required:
                    - id
                    - name
                    - timezone
                    - market
                    - program_type
                    title: Program
                  sites:
                    type: array
                    items:
                      type: object
                      properties:
                        commitment:
                          type: number
                          description: Expected electricity reduction in kW when measured against the site's registered baseline for this dispatch.
                          example: 12
                          format: float
                        customer_location_id:
                          type: string
                          description: An identifier for this site provided by a customer. This can be any identifier supplied by the site owner, such as a store number.
                          example: site101
                        drop_by:
                          description: Amount of power to reduce during dispatch (kW). Nullable. Deprecated.
                          example: 12
                          format: float
                          type: number
                          deprecated: true
                        id:
                          type: string
                          description: Primary key of the site
                          example: xv1w4
                        name:
                          type: string
                          description: Name of the site
                          example: A cool site
                      example:
                        commitment: 12
                        customer_location_id: site101
                        drop_by: 12
                        id: xv1w4
                        name: A cool site
                      required:
                      - name
                      - id
                      - customer_location_id
                      title: DispatchSite
                    description: The sites that must curtail as a result of this dispatch
                    example:
                    - commitment: 1248
                      customer_location_id: site102
                      drop_by: 1248
                      id: yd4g
                      name: The coolest site
                    - commitment: 5.3
                      customer_location_id: ''
                      drop_by: 5.3
                      id: 40wl
                      name: Just an ok site
                  start_time:
                    type: string
                    description: Start time of the dispatch. Formatted as a RFC 3339 timestamp.
                    example: '2024-02-02T09:00:00Z'
                  test:
                    type: boolean
                    description: Whether the dispatch is a test. If this value is false, this is real, non-test dispatch, and you should curtail the site(s). If this value is true, this is a test dispatch, and you do not need to curtail.
                    example: false
                example:
                  authorized: true
                  creation_time: '2024-02-02T08:00:00Z'
                  end_time: '2024-02-02T10:00:00Z'
                  id: 5j94
                  metadata:
                    dispatch_source: manual_test
                  modification_number: 0
                  program:
                    id: 867
                    market: CAISO
                    name: CAISO Operating Reserves
                    program_type: ancillary_services
                    timezone: US/Pacific
                  sites:
                  - commitment: 1248
                    customer_location_id: site102
                    drop_by: 1248
                    id: yd4g
                    name: The coolest site
                  - commitment: 5.3
                    customer_location_id: ''
                    drop_by: 5.3
                    id: 40wl
                    name: Just an ok site
                  start_time: '2024-02-02T09:00:00Z'
                  test: false
                required:
                - id
                - authorized
                - test
                - start_time
                - creation_time
                - modification_number
                - program
                - sites
                title: Dispatch
              example:
                authorized: true
                creation_time: '2024-02-02T08:00:00Z'
                end_time: '2024-02-02T10:00:00Z'
                id: 5j94
                metadata:
                  dispatch_source: manual_test
                modification_number: 0
                program:
                  id: 867
                  market: CAISO
                  name: CAISO Operating Reserves
                  program_type: ancillary_services
                  timezone: US/Pacific
                sites:
                - commitment: 1248
                  customer_location_id: site102
                  drop_by: 1248
                  id: yd4g
                  name: The coolest site
                - commitment: 5.3
                  customer_location_id: ''
                  drop_by: 5.3
                  id: 40wl
                  name: Just an ok site
                start_time: '2024-02-02T09:00:00Z'
                test: false
