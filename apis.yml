apis:
- aid: voltus:voltus-dispatches-api
  name: Voltus Dispatches API
  description: >-
    Grid dispatch events for enrolled sites — list dispatches, retrieve a single
    dispatch by ID, and create a test dispatch. Documented operations are GET
    /dispatches ("Returns a list of dispatches."), POST /dispatches ("Creates a
    test dispatch.") and GET /dispatch ("Retrieves the dispatch with the given
    ID."). Dispatch objects carry program, market (e.g. MISO), program_type,
    start/end time, modification number and per-site drop_by and commitment
    values. Verified live against the public sandbox.
  humanURL: https://api.voltus.co/docs/openapi/dispatches
  baseURL: https://api.voltus.co/2022-04-15
  tags:
  - Demand Response
  - Dispatch
  - Energy Markets
