- aid: voltus:voltus-sites-api
  name: Voltus Sites API
  description: >-
    Read the sites (facilities) enrolled with Voltus under the calling account,
    with their meters. The single documented operation is GET /sites ("Returns a
    list of your sites."), returning site name, id and customer_location_id, with
    an asset_type field on each meter object added 2026-07-01. Verified live
    against the public sandbox.
  humanURL: https://api.voltus.co/docs/openapi/sites
  baseURL: https://api.voltus.co/2022-04-15
