- aid: voltus:voltus-telemetry-api
  name: Voltus Telemetry API
  description: >-
    Submit and retrieve interval energy telemetry for enrolled sites. Documented
    operations are POST /telemetry, POST /telemetry/controllable-load ("Posts
    controllable load.") and GET /telemetry/kw ("Returns a list of telemetry
    readings for one or more sites. The maximum number of sites per request is
    10. The maximum request interval is 90 days, with a limit of 10,000 total
    data points per site."). This is the site-level customer energy-usage
    surface — account-scoped to the API key holder, not a Green Button or
    Consumer Data Right style consented third-party feed.
  humanURL: https://api.voltus.co/docs/openapi/telemetry
  baseURL: https://api.voltus.co/2022-04-15
