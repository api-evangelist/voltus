- aid: voltus:voltus-webhooks-api
  name: Voltus Webhooks API
  description: >-
    Register HTTP callbacks so Voltus can push dispatch notifications instead of
    the partner polling. Documented operations are GET /webhooks ("Returns a list
    of all webhooks that have been created."), POST /webhooks and DELETE
    /webhooks/{id} ("Permanently deletes a webhook. It cannot be undone.").
  humanURL: https://api.voltus.co/docs/openapi/webhooks
