- aid: voltus:voltus-openadr-vtn
  name: Voltus OpenADR 2.0a VTN
  description: >-
    Standards-based alternative to the REST dispatch integration. Voltus states
    it "supports OpenADR2.0a via Simple HTTP (PULL)" and that "Voltus provides a
    VTN, and our partners run one or more VENs". Partners poll
    https://openadr.voltus.co/vtn/YOUR_VEN_ID/OpenADR2/Simple/EiEvent (recommended
    once per minute) and reply with an oadrCreatedEvent acknowledgement.
    Authentication is mutual TLS — the partner submits a Certificate Signing
    Request to Voltus and presents the returned client certificate. The host is
    not anonymously reachable (connection refused on a bare HTTPS GET), which is
    consistent with an mTLS-only endpoint.
  humanURL: https://api.voltus.co/docs/concepts/openadr
  baseURL: https://openadr.voltus.co
  tags:
  - OpenADR
  - Demand Response
  - Standards
  - Dispatch
